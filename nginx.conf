# nginx.conf
# Nginx configuration for the Study Planner frontend (presentation tier).
#
# Responsibilities:
#   - Serve the static SPA (index.html + assets) on port 80
#   - Reverse-proxy API traffic to the FastAPI backend container
#
# Service topology (Docker Compose network):
#   browser  →  frontend:80  →  (static)  index.html
#   browser  →  frontend:80  →  /tasks/*  →  backend:8000
#   browser  →  frontend:80  →  /docs     →  backend:8000
#   browser  →  frontend:80  →  /openapi.json → backend:8000

events {
    # Maximum simultaneous connections per worker.
    # 1024 is a safe default for a development / small-scale deployment.
    worker_connections 1024;
}

http {
    # Ensure correct MIME types are sent for JS, CSS, etc.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Efficient file transfer — skip userspace copy for static files
    sendfile on;

    # Keep-alive timeout for client connections
    keepalive_timeout 65;

    # Disable server version disclosure in headers / error pages
    server_tokens off;

    # ── Upstream: FastAPI backend ──────────────────────────────────────────
    # "backend" resolves via Docker Compose's internal DNS to the backend service.
    upstream fastapi_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;          # Accept any hostname / IP

        # ── Static files (SPA) ───────────────────────────────────────────
        # Files are bind-mounted from app/static into the container at build time.
        root /usr/share/nginx/html;
        index index.html;

        # Serve index.html for the root path
        location = / {
            try_files /index.html =404;
        }

        # Serve any other static asset directly; fall back to index.html
        # so that future client-side routing still works.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API reverse proxy ─────────────────────────────────────────────
        # Route task CRUD, Swagger UI, and the OpenAPI schema to FastAPI.

        location /tasks/ {
            proxy_pass         http://fastapi_backend/tasks/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass         http://fastapi_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass         http://fastapi_backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Health / error pages ──────────────────────────────────────────
        error_page 404 /index.html;   # Hand unknown routes to the SPA
        error_page 500 502 503 504 /index.html;
    }
}
