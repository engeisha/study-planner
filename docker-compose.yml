services:

  # ── Data Tier ──────────────────────────────────────────────────────────────
  # PostgreSQL 15 — the single source of truth for all task data.
  # Only reachable by the backend service on the internal Docker network.
  db:
    image: postgres:15-alpine
    container_name: study-planner-db
    environment:
      POSTGRES_DB:       study_planner
      POSTGRES_USER:     planner
      POSTGRES_PASSWORD: planner_secret
    volumes:
      # Named volume — data survives container stop/remove/rebuild
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Wait until Postgres is actually ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U planner -d study_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  # ── Application Tier ───────────────────────────────────────────────────────
  # FastAPI + Uvicorn — all business logic and database access lives here.
  # Not exposed to the host; only the Nginx frontend talks to it.
  backend:
    build: .
    container_name: study-planner-backend
    environment:
      # SQLAlchemy / Alembic will use this URL instead of the SQLite default
      DATABASE_URL: postgresql://planner:planner_secret@db:5432/study_planner
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy   # Don't start until Postgres passes healthcheck
    # Run Alembic migrations then start the API server.
    # Using shell form so && works; the exec form does not support shell operators.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped


  # ── Presentation Tier ──────────────────────────────────────────────────────
  # Nginx — serves the static SPA and reverse-proxies API calls to the backend.
  # This is the only service exposed to the host.
  frontend:
    image: nginx:alpine
    container_name: study-planner-frontend
    ports:
      - "80:80"      # Visit http://localhost to reach the dashboard
    volumes:
      # Mount the static HTML/JS files into Nginx's default serve directory
      - ./app/static:/usr/share/nginx/html:ro
      # Mount the custom Nginx config (replaces the default nginx.conf)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend      # Backend must be up before Nginx starts proxying
    restart: unless-stopped


# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # Docker manages this volume; data persists across `docker compose down`
    # Use `docker compose down -v` to also delete the volume (full wipe).
